apiVersion: apps/v1
kind: Deployment
metadata:
  name: agri-portal-deployment
  labels:
    app: smart-agri-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smart-agri-portal
  template:
    metadata:
      labels:
        app: smart-agri-portal
    spec:
      containers:
      - name: web-portal-instance
        image: Majorazor/smart-irrigation-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agri-portal-service
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32080
  selector:
    app: smart-agri-portal
